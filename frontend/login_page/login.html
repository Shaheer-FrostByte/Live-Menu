<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main>
        <h2>Login</h2>
        <p class="subtitle">Welcome Back</p>
        <form id="form">
            <div>
                <label>
                    Name
                    <input id="name" name="name" type="text" placeholder="Enter your Name..." autofocus>
                </label>
                <label>
                    Password
                    <input id="pass" name="pass" type="password" placeholder="Enter your Password..." autofocus>
                </label>
                <button id="btn" type="submit">Login</button>
            </div>
        </form>
    </main>

    <script src="login.js"></script>
</body>
</html>
